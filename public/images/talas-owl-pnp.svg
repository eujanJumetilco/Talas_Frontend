<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 58" fill="none" role="img" aria-labelledby="title">
  <title id="title">TALAS owl map pin in police uniform</title>
  <defs>
    <clipPath id="pin">
      <path d="M7 5.5 20 13c2.6-.9 5.4-.9 8 0L41 5.5l-2.7 14.2c3.2 4 5 8.3 5 12.7 0 10.8-8.4 18.2-19.3 23.2C13.1 50.6 4.7 43.2 4.7 32.4c0-4.4 1.8-8.7 5-12.7L7 5.5Z"/>
    </clipPath>
  </defs>
  <!-- body -->
  <path d="M7 5.5 20 13c2.6-.9 5.4-.9 8 0L41 5.5l-2.7 14.2c3.2 4 5 8.3 5 12.7 0 10.8-8.4 18.2-19.3 23.2C13.1 50.6 4.7 43.2 4.7 32.4c0-4.4 1.8-8.7 5-12.7L7 5.5Z" fill="#ffc857"/>
  <path d="M10 9.5 20 15c2.6-.7 5.4-.7 8 0l10-5.5-2 10c2.8 3.4 4.3 7 4.3 10.8 0 8.8-6.4 15.2-16.3 20.3C14.1 45.5 7.7 39.1 7.7 30.3c0-3.8 1.5-7.4 4.3-10.8l-2-10Z" fill="#ffdb82"/>

  <!-- uniform shirt, clipped to pin -->
