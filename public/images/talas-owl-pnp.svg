    <path d="M2 41c8-3.2 36-3.2 44 0V60H2Z" fill="#1d3f8f"/>
    <!-- shoulder epaulettes -->
    <path d="M6 41.5 13 39.8l1.6 4-7.4 1.8Z" fill="#14306e" stroke="#ffc857" stroke-width=".7" stroke-linejoin="round"/>
    <path d="M42 41.5 35 39.8l-1.6 4 7.4 1.8Z" fill="#14306e" stroke="#ffc857" stroke-width=".7" stroke-linejoin="round"/>
    <!-- collar -->
    <path d="M16.5 40.6 24 48l-3.8 2.6L14 42.6Z" fill="#2c56b8" stroke="#071426" stroke-width=".8" stroke-linejoin="round"/>
    <path d="M31.5 40.6 24 48l3.8 2.6L34 42.6Z" fill="#2c56b8" stroke="#071426" stroke-width=".8" stroke-linejoin="round"/>
    <!-- tie -->
    <path d="m24 44.6-1.9 2 .9 1.2L22 55h4l-1-6.8.9-1.2Z" fill="#071426"/>
    <!-- chest badge -->
    <path d="M28.6 47.6h4.6v3.2c0 1.5-1.2 2.3-2.3 2.8-1.1-.5-2.3-1.3-2.3-2.8Z" fill="#ffc857" stroke="#071426" stroke-width=".6" stroke-linejoin="round"/>
    <circle cx="30.9" cy="50.4" r=".9" fill="#2369ff"/>
  </g>

  <!-- outline -->
  <path d="M7 5.5 20 13c2.6-.9 5.4-.9 8 0L41 5.5l-2.7 14.2c3.2 4 5 8.3 5 12.7 0 10.8-8.4 18.2-19.3 23.2C13.1 50.6 4.7 43.2 4.7 32.4c0-4.4 1.8-8.7 5-12.7L7 5.5Z" stroke="#071426" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- face -->
  <ellipse cx="18.2" cy="27.2" rx="7.1" ry="7.6" fill="#fff8e8" stroke="#2369ff" stroke-width="1.5"/>
  <ellipse cx="29.8" cy="27.2" rx="7.1" ry="7.6" fill="#fff8e8" stroke="#2369ff" stroke-width="1.5"/>
  <circle cx="20" cy="27.8" r="3.1" fill="#071426"/><circle cx="31.5" cy="27.8" r="3.1" fill="#071426"/>
  <circle cx="21" cy="26.7" r=".9" fill="#fff8e8"/><circle cx="32.5" cy="26.7" r=".9" fill="#fff8e8"/>
  <path d="m24 32.2 3.4 4.4h-6.8l3.4-4.4Z" fill="#ff8b76"/>
  <ellipse cx="12.2" cy="34.2" rx="2.2" ry="1.25" fill="#ff9b8e"/><ellipse cx="35.8" cy="34.2" rx="2.2" ry="1.25" fill="#ff9b8e"/>

  <!-- peaked cap -->
  <path d="M11 13.2C11 6.6 16 3 24 3s13 3.6 13 10.2Z" fill="#1d3f8f" stroke="#071426" stroke-width="1.2" stroke-linejoin="round"/>
  <path d="M10.2 13.2h27.6V17H10.2Z" fill="#14306e" stroke="#071426" stroke-width="1.2" stroke-linejoin="round"/>
  <path d="M10.2 14.6h27.6" stroke="#ffc857" stroke-width=".8"/>
  <path d="M13.5 17Q24 21.4 34.5 17Z" fill="#071426" stroke="#071426" stroke-width="1" stroke-linejoin="round"/>
  <!-- cap badge -->
  <circle cx="24" cy="9" r="3" fill="#ffc857" stroke="#071426" stroke-width=".8"/>
  <path d="m24 6.9.6 1.4 1.5.1-1.2.9.4 1.5-1.3-.8-1.3.8.4-1.5-1.2-.9 1.5-.1Z" fill="#2369ff"/>

